<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Message 🔒</title>
    <style>
        :root {
            --primary: #bb86fc;
            --secondary: #03dac6;
            --bg: #121212;
            --surface: #1e1e1e;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            user-select: none;
        }

        /* Glitch Effect Class */
        .glitch {
            position: relative;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 20px;
        }

        /* The Button */
        .decrypt-btn {
            background: transparent;
            border: 2px solid var(--secondary);
            color: var(--secondary);
            padding: 15px 40px;
            font-family: inherit;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .decrypt-btn:hover {
            background: var(--secondary);
            color: var(--bg);
            box-shadow: 0 0 20px var(--secondary);
        }

        /* The Golden Ticket Card */
        .ticket-container {
            display: none;
            perspective: 1000px;
        }

        .ticket {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            width: 300px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            animation: float 3s ease-in-out infinite;
            text-align: center;
            border: 2px dashed #000;
        }

        .ticket h2 { margin: 0; font-size: 1.8rem; letter-spacing: -1px; }
        .ticket .choco-icon { font-size: 4rem; margin: 10px 0; display: block; }
        .ticket p { font-size: 0.9rem; font-weight: bold; margin: 5px 0; }
        
        .validity {
            background: #000;
            color: #FFD700;
            padding: 5px;
            font-size: 0.7rem;
            display: inline-block;
            margin-top: 10px;
            border-radius: 4px;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.7rem;
            color: #444;
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        @keyframes scan {
            0% { width: 0; }
            100% { width: 100%; }
        }

        .loader {
            height: 2px;
            background: var(--secondary);
            width: 0;
            margin-bottom: 20px;
            transition: width 2s;
        }
    </style>
</head>
<body>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <div id="screen1">
        <div class="glitch" id="greeting">DETECTING USER...</div>
        <div class="loader" id="loader"></div>
        <button class="decrypt-btn" onclick="decryptMsg()">[ ACCESS DATA ]</button>
    </div>

    <div id="screen2" class="ticket-container">
        <div class="ticket">
            <h2>LUMINA GIFT CARD</h2>
            <span class="choco-icon">🍫</span>
            <p>IOU: ONE REAL CHOCOLATE</p>
            <p style="font-size: 0.8rem; opacity: 0.8;">(Dairy Milk / Galaxy / KitKat)</p>
            
            <div class="validity">VALID AFTER: MODEL EXAMS</div>
        </div>
        <p style="margin-top: 20px; color: #888; font-size: 0.8rem;">Happy Valentine's Day! ✨<br>Study well.</p>
    </div>

    <div class="footer">SECURE CONNECTION // LUMINA v2.0</div>

    <script>
        // 1. Get Name from URL (?name=Evana)
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || "Topper"; // Default to 'Topper' if no name
        
        // 2. Typing Effect for Greeting
        const greetingElement = document.getElementById('greeting');
        greetingElement.innerText = `HELLO ${name.toUpperCase()}...`;

        function decryptMsg() {
            const btn = document.querySelector('.decrypt-btn');
            const loader = document.getElementById('loader');
            
            // UI Feedback
            btn.innerHTML = "UNPACKING...";
            btn.style.borderColor = "#bb86fc";
            btn.style.color = "#bb86fc";
            loader.style.width = "200px";

            // Delay for "Processing" feel
            setTimeout(() => {
                document.getElementById('screen1').style.display = 'none';
                document.getElementById('screen2').style.display = 'block';
                fireConfetti();
            }, 1500);
        }

        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#FFD700', '#FFA500'] // Gold colors
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#bb86fc', '#ffffff'] // Purple/White
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
